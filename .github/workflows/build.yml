name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - build-diagnostics.txt
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build and capture diagnostics
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build-diagnostics.txt 2>&1
          code=$?
          cat build-diagnostics.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist build diagnostics
        if: steps.build.outputs.exit_code != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-diagnostics.txt
          git commit -m "Record build diagnostics [skip ci]" || true
          git push
      - name: Fail on build error
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
